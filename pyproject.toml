[project]
name = "org_chart_mtp"
authors = [
    { name = "MTPplus", email = "info@mtp.plus" }
]
description = "Оргструктура компании — интерактивный оргчарт для Frappe/HRMS (Desk, v16)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "E501",  # line too long
    "B017",  # assertRaises(Exception)
    "B018",  # useless expression
    "B023",  # function doesn't bind loop variable
    "B904",  # raise inside except without from
    "E402",  # module level import not at top of file
    "UP031", # percent format
    "UP032", # str.format
    "F401",  # unused imports
]
